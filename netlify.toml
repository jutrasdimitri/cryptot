[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = ["PERSONA.md", "briefs/*.md"]

[[redirects]]
  from = "/api/historian"
  to = "/.netlify/functions/historian"
  status = 200

[[redirects]]
  from = "/api/historian-webhook"
  to = "/.netlify/functions/historian-webhook"
  status = 200
