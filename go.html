<body>
  <div>
    <p class="brand">CRYPTO<span>T</span> — COIN DU JOUR // COIN OF THE DAY</p>
    <p id="msg">Redirection vers la page info du jour… // Redirecting to today's info page…</p>
    <noscript>
      <p>Choisis ton coin // Pick your coin :</p>
      <p class="links">
        <a href="/ada.html">ADA</a>·<a href="/eth.html">ETH</a>·<a href="/sol.html">SOL</a>·<a href="/xrp.html">XRP</a>·<a href="/btc.html">BTC</a>

  <script>
    // Lien en bio → page INFO du coin du jour (éduquer avant de vendre).
    // Même rotation que les posts IG (ancre : dim 20 sept 2026 = ADA).
    (function () {
      var ORDER = ["ADA", "ETH", "SOL", "XRP", "BTC"];
      try {
        var anchor = new Date(2026, 8, 20);
        anchor.setHours(0, 0, 0, 0);
        var today = new Date();
        today.setHours(0, 0, 0, 0);
        var diff = Math.round((today - anchor) / 86400000);
        var coin = ORDER[((diff % 5) + 5) % 5].toLowerCase();
        var lang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
        var page = (lang.indexOf("fr") === 0 ? "fr-" : "") + coin + ".html";
        window.location.replace("/" + page);
      } catch (e) {
        document.getElementById("msg").textContent = "Choisis ton coin ci-dessous. // Pick your coin below.";
      }
    })();
  </script>
